<!doctype html>
<html lang="en" style="background-color: #000000">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Victoria Ghoos</title>
    <meta
      name="description"
      content="Portfolio of Victoria Ghoos. Software Engineering student specialized in .NET, C# and modern web technologies. Check out my projects and CV."
    />
    <meta name="author" content="Victoria Ghoos" />
    <meta property="og:title" content="Victoria Ghoos" />
    <meta property="og:description" content="Take a look at my e-portfolio, projects and skills." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://victoriaghoos.com/og-image.png" />
    <link rel="icon" href="/petal.png" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!--
      The hologram photo is the largest thing on screen on phones and tablets (the LCP element).
      Without this the browser only finds it after the JS has run. The media query matches the
      devices that get the static photo instead of the 3D hub (see show3DNav in Home.tsx), so
      desktops with the 3D hub don't fetch it this early.
    -->
    <link
      rel="preload"
      as="image"
      href="/src/assets/images/hologram.webp"
      fetchpriority="high"
      media="(max-width: 1023.98px), not all and (pointer: fine), not all and (hover: hover)"
    />
    <style>
      body,
      html {
        background-color: #000000;
        margin: 0;
        padding: 0;
      }
      .static-glow {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          rgba(0, 0, 0, 0.3) 0%,
          rgba(74, 0, 128, 0.1) 50%,
          rgba(0, 0, 0, 0.3) 100%
        );
        z-index: 2;
        opacity: 0;
        animation: entranceFade 3s ease-out 0.2s forwards;
      }
      .static-particles {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
      }
      .static-dot {
        position: absolute;
        background: rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        opacity: 0;
        animation: entranceFade 4s ease-out 0.5s forwards;
      }
      @keyframes entranceFade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body style="background-color: #000000">
    <noscript>
      <!-- Shown when JavaScript is off: the 3D site can't run, but the essentials still can -->
      <main
        style="
          max-width: 40rem;
          margin: 0 auto;
          padding: 3rem 1.5rem;
          color: #fff;
          font-family: system-ui, sans-serif;
          line-height: 1.6;
        "
      >
        <h1>Victoria Ghoos</h1>
        <p>
          I'm a software engineer in my final year of Applied Computer Science (software
          engineering) at Howest in Bruges.
        </p>
        <p>
          This portfolio is an interactive 3D site that needs JavaScript. Without it, you can still
          find me here:
        </p>
        <ul>
          <li>
            <a style="color: #c4b5fd" href="https://www.linkedin.com/in/victoriaghoos/">LinkedIn</a>
          </li>
          <li><a style="color: #c4b5fd" href="https://github.com/victoriaghoos">GitHub</a></li>
          <li>
            <a style="color: #c4b5fd" href="mailto:ghoosvictoria@gmail.com"
              >ghoosvictoria@gmail.com</a
            >
          </li>
        </ul>
      </main>
    </noscript>
    <div id="root" style="background-color: #000000"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
